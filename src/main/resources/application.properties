spring.application.name=webtruyen

spring.datasource.url=jdbc:mysql://localhost:3306/Web_Truyen?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

app.jwt.secret=V2ViVHJ1eWVuU3VwZXJTZWNyZXRLZXlGb3JKV1QxMjM0NTY3ODkwMTIzNDU2
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.port=8081

# Email (Gmail SMTP). Use an App Password (not your normal Gmail password).
# Keep secrets out of git by using environment variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP settings (password reset / change password via email OTP)
app.otp.pepper=${OTP_PEPPER:CHANGE_ME_TO_A_RANDOM_SECRET}
app.otp.digits=6
app.otp.expiry-minutes=10
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5
app.otp.max-verify-attempts=5
