spring.application.name=webtruyen
spring.profiles.default=local

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

server.port=${SERVER_PORT:${PORT:8081}}

# JWT
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Email (Gmail SMTP by default). Credentials should come from environment variables.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# OTP settings
app.otp.digits=${APP_OTP_DIGITS:6}
app.otp.expiry-minutes=${APP_OTP_EXPIRY_MINUTES:10}
app.otp.resend-cooldown-seconds=${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-sends-per-hour=${APP_OTP_MAX_SENDS_PER_HOUR:5}
app.otp.max-verify-attempts=${APP_OTP_MAX_VERIFY_ATTEMPTS:5}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.exposed-headers=${APP_CORS_EXPOSED_HEADERS:Authorization}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}
app.cors.max-age-seconds=${APP_CORS_MAX_AGE_SECONDS:3600}
