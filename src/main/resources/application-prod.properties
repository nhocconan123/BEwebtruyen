spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=false

management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD}}

app.jwt.secret=${APP_JWT_SECRET}
app.otp.pepper=${APP_OTP_PEPPER:${OTP_PEPPER}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
